<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মির্জাপুর | Concept 02 — Title, Search, Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (from original :root) ===== */
:root{--o:#ff6a13;--ink:#17171a;--mut:#74747c;--bg:#fbfaf8;--card:#fff;--soft:#f1f0ee;--r:22px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:var(--sat);padding-bottom:var(--sab)}
*{box-sizing:border-box;margin:0}html{background:var(--bg)}
/* body background is transparent here so the pastel backdrop layer (#bgt) is visible */
body{background:transparent;font:400 15px/1.55 'Hind Siliguri','Inter',system-ui,sans-serif;color:var(--ink);min-height:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.5,1.7,.4,1)}
button:hover svg.i,.tile:hover svg.i{transform:translateY(-3px) scale(1.12) rotate(-4deg)}
.c2{--r:28px}
.w{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
/* ===== Pastel backdrop (Concept 02) ===== */
#bgt{position:fixed;inset:0;z-index:-1;transition:background 1s;background:radial-gradient(circle at 20% 0,#ffd9f5,#fff 60%)}
/* ===== 1. Top branding ===== */
h1{font-size:clamp(28px,5.5vw,52px);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.c2 .hero{text-align:center;padding:26px 0 8px}
/* ===== 2. Search bar ===== */
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:6px 8px 6px 16px;box-shadow:0 6px 24px #0000000d,inset 0 0 0 1px #0000000a}
.sb input{flex:1;border:0;background:none;outline:0;min-width:0;padding:6px 0}
.sb i{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#ff9a3d,var(--o));display:grid;place-items:center;color:#fff}
.c2 .tile,.c2 .card,.c2 .row,.c2 .sb{background:#ffffffa8;backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px #fff,0 18px 40px -22px #7a6fc9aa}
/* ===== Sample cards (only the trigger for the detail view; original glass card style) ===== */
.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left;box-shadow:0 12px 30px -18px #0004;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.5,1.6,.4,1)}
.card:hover{transform:translateY(-4px)}
.art{height:150px;display:grid;place-items:center;background:var(--tint,#ffe9d9)}
.art svg{width:120px;height:120px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.cb h3{font-size:17px;font-weight:600;line-height:1.3}
.m{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);align-items:center}
.st{color:var(--o);font-weight:600}.op{color:#1f9d62;font-weight:600}.cl{color:#c0392b;font-weight:600}
.demo{font-size:12px;color:var(--mut);background:var(--soft);border-radius:12px;padding:6px 12px;margin:10px 0}
/* ===== 3. Detail view (modal) ===== */
#mod{position:fixed;inset:0;z-index:60;background:#0006;display:none;align-items:flex-end;justify-content:center}
#mod.on{display:flex}
#mod .p{background:#fff;width:min(520px,100%);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + var(--sab));max-height:88%;overflow:auto;animation:up .35s cubic-bezier(.3,1.4,.5,1)}
@media(min-width:700px){#mod{align-items:center}#mod .p{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #0002}
.x{float:right;width:36px;height:36px;border-radius:50%;background:var(--soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="c2">
<div id="bgt"></div>

<div class="w">
  <!-- 1. Top branding -->
  <div class="hero">
    <h1 style="margin:8px 0">মির্জাপুর</h1>
    <!-- 2. Search bar -->
    <label class="sb"><input id="q" type="search" placeholder="Search — দোকান, খাবার, পণ্য খুঁজুন" aria-label="Search"><i><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></i></label>
  </div>
  <div class="demo">এই প্রিভিউর সব দোকান, দাম ও রেটিং ডেমো — যাচাইকৃত তথ্য নয়।</div>
  <!-- Sample cards: click one to open the detail view (3) -->
  <div id="res"></div>
</div>

<!-- 3. Detail view -->
<div id="mod"><div class="p" id="mp"></div></div>

<script>
const $=s=>document.querySelector(s),bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const IC={cloth:'M8 4L3 7l2 4 3-1v10h8V10l3 1 2-4-5-3a4 4 0 01-8 0z'};
/* Sample (demo) data: [cat,name,rating,reviews,price,open,address,hue,items] */
const B=[
['food','ডেমো বিরিয়ানি ঘর',4.6,212,160,1,'ডেমো ঠিকানা, মির্জাপুর বাজার',20,[['কাচ্চি',220],['তেহারি',120],['বোরহানি',30]]],
['food','ডেমো কাচ্চি দরবার',4.4,148,230,1,'ডেমো ঠিকানা, মির্জাপুর বাজার',8,[['মাটন কাচ্চি',320],['রোস্ট',90]]],
['food','ডেমো গ্রিল কর্নার',4.8,301,280,0,'ডেমো ঠিকানা, মির্জাপুর বাজার',35,[['গ্রিল চিকেন',260],['নান',25]]],
['cloth','ডেমো শাড়ি মহল',4.7,130,2600,1,'ডেমো ঠিকানা, মির্জাপুর বাজার',330,[['সুতি শাড়ি',1900],['জামদানি',6500]]]];
const isF=b=>b[0]=='food'||b[0]=='hotel';
function art(b){const h=b[7];if(isF(b))return`<svg viewBox="0 0 120 120"><ellipse cx="60" cy="74" rx="52" ry="30" fill="#fff"/><ellipse cx="60" cy="70" rx="42" ry="23" fill="hsl(${h},75%,86%)"/><path d="M26 68c6-30 62-30 68 0-12 14-56 14-68 0z" fill="hsl(${h},80%,62%)"/><circle cx="48" cy="52" r="6" fill="hsl(${h+15},60%,40%)"/><circle cx="70" cy="48" r="5" fill="#fff9"/><path d="M50 30c-6-8 6-10 0-18M68 32c-6-8 6-10 0-18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/></svg>`;
return`<svg viewBox="-1 -1 26 26"><path d="${IC.cloth}" fill="hsl(${h},70%,70%)" stroke="hsl(${h},50%,30%)" stroke-width=".7" stroke-linejoin="round"/></svg>`}
const op=b=>b[5]?'<span class="op">খোলা (ডেমো)</span>':'<span class="cl">বন্ধ (ডেমো)</span>';
function card(b){return`<button class="card" data-b="${B.indexOf(b)}" style="--tint:hsl(${b[7]},90%,92%)"><div class="art">${art(b)}</div><div class="cb"><h3>${b[1]}</h3><div class="m"><span class="st">★ ${bn(b[2])}</span><span>(${bn(b[3])})</span><span>${isF(b)?'গড় ':'শুরু '}৳${bn(b[4])}</span></div><div class="m">${isF(b)?op(b):b[8].map(x=>x[0]+' ৳'+bn(x[1])).join(' · ')}</div>${isF(b)?`<div class="m">${b[8].map(x=>x[0]+' ৳'+bn(x[1])).join(' · ')}</div>`:''}</div></button>`}
let q='';
function res(){const l=B.filter(b=>!q||(b[1]+b[8].map(x=>x[0]).join()).includes(q.trim()));
$('#res').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="sub" style="padding:30px 0">কিছু পাওয়া যায়নি। অন্য শব্দ বা ক্যাটাগরি চেষ্টা করুন।</p>'}
function open_(i){const b=B[i];$('#mp').innerHTML=`<button class="x" data-x="1" aria-label="বন্ধ করুন">✕</button><div class="art" style="--tint:hsl(${b[7]},90%,92%);border-radius:20px;height:130px;margin-bottom:12px">${art(b)}</div><h2 style="font-size:22px">${b[1]}</h2><div class="m" style="margin:4px 0 10px"><span class="st">★ ${bn(b[2])}</span><span>${bn(b[3])}টি রিভিউ</span>${op(b)}</div>${b[8].map(x=>`<div class="li"><span>${x[0]}</span><b>৳${bn(x[1])}</b></div>`).join('')}<p class="m" style="margin-top:12px">${b[6]}</p><div class="demo" style="margin-top:12px">ডেমো তথ্য — বাস্তব দোকান, দাম বা সময় নয়।</div>`;$('#mod').classList.add('on')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-b],[data-x]');
if(e.target.id=='mod'||(t&&t.dataset.x)){$('#mod').classList.remove('on');return}
if(t&&t.dataset.b)open_(+t.dataset.b)});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;res()}});
addEventListener('keydown',e=>{if(e.key=='Escape')$('#mod').classList.remove('on')});
res();
</script></body></html>
